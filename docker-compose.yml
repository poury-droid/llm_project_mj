services:
  postgres:
    image: postgres:16
    container_name: job-process-assistant-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: job_process_assistant
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
